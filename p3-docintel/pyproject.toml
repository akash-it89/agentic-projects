[project]
name = "p3docintel"
version = "0.1.0"
description = "Document intelligence: extract, locate, classify, summarise and chat (capstone project 3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "pillow>=10.1",
    "numpy>=1.26",
    "openai>=1.50",
    "ollama>=0.4",
    "httpx>=0.27",
]

[dependency-groups]
# Scanned documents and photos need OCR: `uv sync --group ocr`
ocr = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
# AWS Textract (OCR_ENGINE=textract) and Bedrock (LLM_PROVIDER=bedrock)
aws = ["boto3>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p3docintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# File(...)/Form(...) defaults are FastAPI's documented way to declare upload parameters.
"src/p3docintel/api.py" = ["B008"]
