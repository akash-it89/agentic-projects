[project]
name = "p1avatar"
version = "0.1.0"
description = "Multilingual airport information talking avatar (capstone project 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",
    "qdrant-client>=1.12",
    "boto3>=1.35",
]

[dependency-groups]
# Install only what each phase needs, e.g. `uv sync --group rag --group voice`
rag = ["sentence-transformers>=3.0"]
voice = ["faster-whisper>=1.1"]
realtime = ["livekit-agents[openai,silero]>=1.0"]
nova = ["livekit-plugins-aws[realtime]>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p1avatar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# File(...)/Form(...) defaults are FastAPI's documented way to declare upload parameters.
"src/p1avatar/api/main.py" = ["B008"]
"ditto_service/server.py" = ["B008"]
