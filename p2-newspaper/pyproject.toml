[project]
name = "p2news"
version = "0.1.0"
description = "Newspaper digitization on a budget: one ID, text and bounding box per article (capstone project 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.1",
    "scipy>=1.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jiwer>=3.0",
    "ollama>=0.4",
]

[dependency-groups]
# PaddleOCR is heavy, so it's a separate group: `uv sync --group ocr`.
# For an NVIDIA GPU, install paddlepaddle-gpu from the PaddlePaddle install selector instead.
ocr = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
